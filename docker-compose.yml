# Local development database only. UAT/production get DATABASE_URL from the deploy platform.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in frontend/.env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in frontend/.env.local}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in frontend/.env.local}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # host 5433: a local Windows PostgreSQL often owns 5432
    volumes:
      - bambam-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bambam-db:
