name: Release BAMBAM

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: bambam-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/rmcdevlab/bambam

jobs:
  image:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./deploy/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:release
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/release'
    runs-on: [self-hosted, Linux, X64, bambam, production]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Prepare temporary registry session
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/bambam-docker" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Deploy published image
        env:
          BAMBAM_IMAGE: ${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
        run: bash deploy/release.sh
      - name: Remove registry credentials
        if: always()
        run: |
          if [[ -z "${DOCKER_CONFIG:-}" ]]; then exit 0; fi
          docker logout ghcr.io
          python3 -c 'import os, shutil; shutil.rmtree(os.environ["DOCKER_CONFIG"], ignore_errors=True)'
