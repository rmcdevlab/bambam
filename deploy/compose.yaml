name: bambam
services:
  app:
    image: ${BAMBAM_IMAGE:?Set BAMBAM_IMAGE to the published image digest}
    container_name: bambam
    restart: unless-stopped
    env_file: ./env/production.env
    extra_hosts:
      - 'rmc-sso.cipcloud.net:192.168.1.48'
    volumes:
      - ./data/photos:/app/data/photos
    networks: [internal, portal]
    ports: ['127.0.0.1:3300:3000']
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/bambam/health/ready", {headers:{Authorization:"Bearer "+process.env.SSO_CLIENT_SECRET}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 8s
      start_period: 40s
      retries: 3
networks:
  internal:
  portal:
    external: true
    name: rmc-portal-network
